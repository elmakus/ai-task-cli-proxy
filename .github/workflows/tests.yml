name: Adapter tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest aiohttp voluptuous
      - name: Compile integration
        run: python -m compileall -q custom_components/ai_task_cli_proxy
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/ai_task_cli_proxy/manifest.json > /dev/null
      - name: Run unit tests
        run: python -m pytest -q tests/
