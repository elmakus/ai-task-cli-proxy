name: Adapter tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest aiohttp voluptuous pillow ruff==0.14.3
      - name: Lint
        run: ruff check custom_components tests tests_native
      - name: Compile integration
        run: python -m compileall -q custom_components/ai_task_cli_proxy
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/ai_task_cli_proxy/manifest.json > /dev/null
      - name: Run unit tests
        run: python -m pytest -q tests/

  native:
    name: Native Home Assistant AI Task contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned native test dependencies
        run: python -m pip install -r requirements-native-tests.txt
      - name: Test the native AI Task service with synthetic responses
        run: python -m pytest -p no:respx --asyncio-mode=auto -o asyncio_default_fixture_loop_scope=function -q tests_native/
